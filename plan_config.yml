    - "18-645"
    # Introduction to Machine Learning
    - "10-601"
    # Introduction to Deep Learning
    - "11-785"
    # Distributed Systems
    - "15-640"
    # Networking and the Internet
    - "15-641"
  # Maximum total units from elective_courses in a schedule.
  max_elective_units: 24

# Courses used to evaluate prerequisite status.
