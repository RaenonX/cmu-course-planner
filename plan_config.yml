    # Communications for Software Leaders I
    - "17-603"
    # Statistics for Decision Making
    - "17-611"
    # Formal Methods
    - "17-614"
    # Product Management Essentials I
    - "17-619"
    # Agile Methods
    - "17-622"
    # Quality Assurance
    - "17-623"
    # Requirements for Information Systems
    - "17-626"
  # Optional courses considered within max_elective_units.
