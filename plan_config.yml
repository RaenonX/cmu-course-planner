# Maximum suggested-course units for F26, S27, M27, and F27, in order.
units_per_semester: [18, 24, 24, 24]

# Semesters to plan, in order. Supported values: F, S, and Su.
semesters: [F, S, Su, F]

# Teaching location used to select course offerings.
teaching_location: "Pittsburgh, Pennsylvania"

# Inputs for exhaustive schedule enumeration in one semester.
feasible_schedule:
